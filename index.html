<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คุณเป็นสกุชชี่แบบไหน?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4f3 0%, #e8e0ff 40%, #d4eeff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sarabun', sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      opacity: 0.35;
      pointer-events: none;
    }
    .blob-1 { width: 320px; height: 320px; background: radial-gradient(circle, #ffb3d9, transparent); top: -90px; left: -90px; }
    .blob-2 { width: 360px; height: 360px; background: radial-gradient(circle, #b3c6ff, transparent); bottom: -110px; right: -110px; }
    .blob-3 { width: 240px; height: 240px; background: radial-gradient(circle, #c8f0d4, transparent); top: 25%; right: -60px; }
    .blob-4 { width: 200px; height: 200px; background: radial-gradient(circle, #ffe4b3, transparent); bottom: 25%; left: -50px; }

    .card {
      background: white;
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(180, 140, 210, 0.18);
      position: relative;
      z-index: 1;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── WELCOME ── */
    .welcome-icon { font-size: 64px; text-align: center; margin-bottom: 12px; line-height: 1; }
    .welcome-subtitle {
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: #d17fb0;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .welcome-title {
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 34px;
      font-weight: 600;
      color: #5b3fa0;
      line-height: 1.2;
      margin-bottom: 18px;
    }
    .intro-box {
      background: #faf6ff;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 15px;
      color: #7c6ea0;
      line-height: 1.75;
    }
    .welcome-desc {
      text-align: center;
      color: #8a7aaa;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .start-btn {
      width: 100%;
      background: linear-gradient(135deg, #d186c8, #9b72e8);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(155, 114, 232, 0.35);
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(155, 114, 232, 0.45); }

    /* ── QUIZ ── */
    .progress-bar {
      width: 100%; height: 6px;
      background: #f0e8ff;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c084fc, #818cf8);
      border-radius: 3px;
      transition: width 0.35s ease;
    }
    .q-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #b399d4;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .q-dimension {
      font-size: 13px;
      color: #c084fc;
      margin-bottom: 12px;
    }
    .q-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: #3d2d70;
      line-height: 1.35;
      margin-bottom: 20px;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: #faf6ff;
      border: 2px solid #ede5ff;
      border-radius: 14px;
      padding: 14px 16px;
      font-family: 'Sarabun', sans-serif;
      font-size: 15px;
      color: #5b3fa0;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.4;
    }
    .option-btn:hover {
      background: #f0e8ff;
      border-color: #c084fc;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(192, 132, 252, 0.2);
    }
    .option-btn:active { transform: translateY(0); }
    .opt-emoji { font-size: 22px; flex-shrink: 0; margin-top: 1px; }

    .quiz-content { transition: opacity 0.26s ease; }
    .quiz-content.fading { opacity: 0; }

    /* ── RESULT ── */
    .result-header { text-align: center; margin-bottom: 18px; }
    .result-emoji { font-size: 72px; display: block; margin-bottom: 10px; }
    .result-label {
      font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--ink, #5b3fa0);
      opacity: 0.7; margin-bottom: 6px;
    }
    .result-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 30px; font-weight: 600;
      color: var(--ink, #5b3fa0);
      margin-bottom: 4px;
    }
    .result-tagline { font-size: 14px; color: #8a7aaa; }

    .result-desc {
      background: var(--soft, #faf6ff);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 15px;
      color: #5b3fa0;
      line-height: 1.75;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 12px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #b399d4; margin-bottom: 8px;
    }
    .strength-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .strength-tag {
      background: var(--soft, #faf6ff);
      border: 1.5px solid #e8e0ff;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      color: var(--ink, #5b3fa0);
    }

    .besties { display: flex; gap: 12px; margin-bottom: 22px; }
    .bestie {
      flex: 1; background: var(--soft, #faf6ff);
      border-radius: 14px; padding: 14px;
      text-align: center;
    }
    .bestie-emoji { font-size: 28px; display: block; margin-bottom: 5px; }
    .bestie-name { font-size: 13px; color: var(--ink, #5b3fa0); line-height: 1.3; }

    .share-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn {
      flex: 1; padding: 13px 10px;
      border: none; border-radius: 14px;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .btn-primary { background: linear-gradient(135deg, #c084fc, #818cf8); color: white; }
    .btn-fb { background: #1877f2; color: white; flex: none; padding: 13px 18px; font-size: 16px; }
    .btn-ig {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: white; flex: none; padding: 13px 16px;
    }
    .copy-notice { text-align: center; font-size: 13px; color: #c084fc; height: 20px; margin-bottom: 10px; }
    .restart-btn {
      width: 100%; background: none;
      border: 2px solid #e8e0ff;
      border-radius: 14px; padding: 13px;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px; color: #8a7aaa;
      cursor: pointer; transition: all 0.18s ease;
    }
    .restart-btn:hover { border-color: #c084fc; color: #5b3fa0; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <!-- WELCOME -->
    <div class="screen active" id="screen-welcome">
      <div class="welcome-icon">🧁</div>
      <div class="welcome-subtitle">A Squishy Personality Quiz</div>
      <div class="welcome-title">คุณเป็นสกุชชี่<br>แบบไหน?</div>
      <div class="intro-box">
        วันนี้คุณสะดุดประตูมิติโดยไม่ได้ตั้งใจ และตอนนี้กำลังยืนอยู่หน้าทางเข้าดินแดนเวทมนตร์ ไม่มีแผนที่ ไม่มี GPS แต่ก็ไม่เป็นไร... มาดูกันว่าคุณเป็นสกุชชี่แบบไหน

    <!-- QUIZ -->
    <div class="screen" id="screen-quiz">

        <div class="q-text" id="q-text"></div>
        <div class="options" id="options"></div>
      </div>
    </div>

    <!-- RESULT -->
    <div class="screen" id="screen-result">
      <div class="result-header">
        <span class="result-emoji" id="r-emoji"></span>
        <div class="result-label">คุณคือ...</div>
        <div class="result-name" id="r-name"></div>
        <div class="result-tagline" id="r-tagline"></div>
      </div>
      <div class="result-desc" id="r-desc"></div>
      <div class="section-title">จุดแข็ง</div>
      <div class="strength-tags" id="r-strengths"></div>
      <div class="section-title">เพื่อนสนิท</div>
      <div class="besties" id="r-besties"></div>
      <div class="share-row">
        <button class="btn btn-primary" onclick="shareResult()">แชร์ผล 🎉</button>
        <button class="btn btn-fb" onclick="shareFb()">f</button>
        <button class="btn btn-ig" onclick="shareIg()">📸</button>
      </div>
      <div class="copy-notice" id="copy-notice"></div>
      <button class="restart-btn" onclick="restartQuiz()">← ทำอีกครั้ง</button>
    </div>
  </div>

      },
      {
        label: 'ข้อ 7 — อยู่บนเมฆ', dimension: '💛 วัด ความสัมพันธ์',
        text: 'บนเมฆมีที่ว่างกว้างมาก คุณทำอะไรก่อนเลย?',
        options: [
          { emoji: '🧺', text: 'ปูผ้าปิกนิก แล้วโทรชวนเพื่อนขึ้นมาด้วย', type: 'alpaca' },
          { emoji: '🔭', text: 'หยิบกล้องส่องทางไกล สำรวจคนเดียวก่อน', type: 'panda' },
          { emoji: '🎉', text: 'กระโดดโหวกเหวก ดีใจที่ได้ขึ้นมาถึง', type: 'strawberry' },
          { emoji: '📖', text: 'นั่งเงียบๆ ดูวิว แล้วจดบันทึกความรู้สึก', type: 'mochi' }
        ]
      },
      {
        label: 'ข้อ 8 — ถึงเวลากลับ', dimension: '🎯 วัด การตัดสินใจ',
        text: 'พระอาทิตย์ตกแล้ว สัตว์วิเศษบอกว่าต้องกลับ คุณ...',
        options: [
          { emoji: '😢', text: 'โอเค แต่ขอกอดมันไว้อีกนิดก่อนนะ', type: 'alpaca' },
          { emoji: '📅', text: 'โอเค แต่ขอนัดว่าจะกลับมาอีกเมื่อไหร่ก่อน', type: 'mochi' },
          { emoji: '😎', text: 'โอเค แล้วก็กระโดดกลับลงไปเลย ไม่เสียดาย', type: 'strawberry' },
          { emoji: '🔥', text: 'ยังไม่กลับ! ขอสำรวจอีกหน่อย', type: 'panda' }
        ]
      }
    ];

    let scores = {};
    let currentQ = 0;
    let fading = false;

    function startQuiz() {
      scores = { alpaca: 0, strawberry: 0, panda: 0, mochi: 0 };
      currentQ = 0;
      fading = false;
      showScreen('quiz');
      renderQ();
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + id).classList.add('active');
    }

    function renderQ() {
      const q = QUESTIONS[currentQ];
      document.getElementById('progress-fill').style.width = (currentQ / QUESTIONS.length * 100) + '%';
      document.getElementById('q-label').textContent = q.label;
      document.getElementById('q-dimension').textContent = q.dimension;
      document.getElementById('q-text').textContent = q.text;

      const optEl = document.getElementById('options');
      optEl.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = '<span class="opt-emoji">' + opt.emoji + '</span><span>' + opt.text + '</span>';
        btn.onclick = () => pick(opt.type);
        optEl.appendChild(btn);
      });
    }

    function pick(type) {
      if (fading) return;
      scores[type]++;
      fading = true;
      const content = document.getElementById('quiz-content');
      content.classList.add('fading');
      setTimeout(() => {
        if (currentQ >= QUESTIONS.length - 1) {
          showResult();
        } else {
          currentQ++;
          renderQ();
          content.classList.remove('fading');
          fading = false;
        }
      }, 260);
    }

    function winner() {
      const order = ['alpaca', 'strawberry', 'panda', 'mochi'];
      let best = order[0];
      for (const k of order) if (scores[k] > scores[best]) best = k;
      return TYPES[best];
    }

    function showResult() {
      const t = winner();
      const card = document.querySelector('.card');
      card.style.setProperty('--soft', t.soft);
      card.style.setProperty('--ink', t.ink);

      document.getElementById('r-emoji').textContent = t.emoji;
      document.getElementById('r-name').textContent = t.name;
      document.getElementById('r-tagline').textContent = t.tagline;
      document.getElementById('r-desc').textContent = t.description;
      document.getElementById('r-strengths').innerHTML =
        t.strengths.map(s => '<span class="strength-tag">' + s + '</span>').join('');
      document.getElementById('r-besties').innerHTML =
        t.besties.map(k => {
          const b = TYPES[k];
          return '<div class="bestie"><span class="bestie-emoji">' + b.emoji + '</span><div class="bestie-name">' + b.name + '</div></div>';
        }).join('');
      document.getElementById('progress-fill').style.width = '100%';
      showScreen('result');
    }

    function restartQuiz() { showScreen('welcome'); }

    function shareData() {
      const t = winner();
      return {
        text: 'ฉันเป็น ' + t.name + ' ' + t.emoji + ' ในควิซ "คุณเป็นสกุชชี่แบบไหน?" 🧁 แล้วคุณล่ะ?',
        url: window.location.href
      };
    }
    function shareResult() {
      const d = shareData();
      if (navigator.share) {
        navigator.share({ title: 'คุณเป็นสกุชชี่แบบไหน?', text: d.text, url: d.url }).catch(() => {});
      } else { shareFb(); }
    }
    function shareFb() {
      const d = shareData();
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(d.url) + '&quote=' + encodeURIComponent(d.text), '_blank');
    }
    function shareIg() {
      const d = shareData();
      try { if (navigator.clipboard) navigator.clipboard.writeText(d.text); } catch(e) {}
      const n = document.getElementById('copy-notice');
      n.textContent = '✓ คัดลอกแล้ว! วางในแคปชัน IG ได้เลย';
      setTimeout(() => n.textContent = '', 2400);
      window.open('https://www.instagram.com/', '_blank');
    }
  </script>
</body>
</html>
